</div><dialog id="modal" aria-labelledby="modalTitle"><header class="modal-header"><h2 id="modalTitle"></h2><button class="icon-button" data-action="close" aria-label="Fechar janela"><svg class="icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z" opacity="0.2"/><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button></header><div class="modal-content" id="modalContent"></div></dialog><div class="toast" id="toast" role="status" hidden></div><script id="calculation-engine">function simulate(input,car,a){
  const positive=[input.kmDay,input.daysMonth,car.range,car.battery,car.gas?.urban,a.homeTariff,a.publicTariff,a.gasPrice,a.rangeFactor,a.window,a.efficiency,a.safety];
  if(positive.some(n=>!Number.isFinite(n)||n<=0)||input.daysMonth>31||input.kmDay>1000||!['yes','no'].includes(input.charging)||a.rangeFactor>1||a.window>1||a.efficiency>1||a.safety<1)throw new Error('Confira os valores da simulação.');
  const monthlyKm=input.kmDay*input.daysMonth;
  const effectiveRange=car.range*a.rangeFactor;
  const usableRange=effectiveRange*a.window;
  const consumption=car.battery/effectiveRange;
  const tariff=input.charging==='yes'?a.homeTariff:a.publicTariff;
  const electricCost=monthlyKm*consumption/a.efficiency*tariff;
  const fuelCost=monthlyKm/car.gas.urban*a.gasPrice;
  const status=input.kmDay*a.safety>usableRange?'not-fit':input.charging==='no'?'adjust':'fits';
  return {status,monthlyKm,effectiveRange,usableRange,consumption,tariff,electricCost,fuelCost,savings:fuelCost-electricCost,electricPerKm:electricCost/monthlyKm,fuelPerKm:fuelCost/monthlyKm};
}
function normalizeFuel(payload){
  if(!payload||payload.error!==false||!payload.precos||!payload.precos.gasolina||typeof payload.data_coleta!=='string'||!/^\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2}:\d{2})?$/.test(payload.data_coleta))throw new Error('Resposta de preços inválida');
  const validStates=new Set('ac al am ap ba ce df es go ma mg ms mt pa pb pe pi pr rj rn ro rr rs sc se sp to'.split(' '));const prices={};
  for(const [uf,raw] of Object.entries(payload.precos.gasolina)){if(!validStates.has(uf))continue;const price=typeof raw==='number'?raw:Number(String(raw).trim().replace(',','.'));if(Number.isFinite(price)&&price>0&&price<50)prices[uf]=price;}
  if(!Object.keys(prices).length)throw new Error('Sem preços por estado');
  return {prices,collectedAt:payload.data_coleta,source:payload.fonte||'https://combustivelapi.com.br/'};
}
if(typeof module!=='undefined')module.exports={simulate,normalizeFuel};

const CARS={mini:{id:'mini',name:'Dolphin Mini',version:'GS',full:'BYD Dolphin Mini GS',range:280,battery:38.88,category:'Subcompactos',gas:{name:'Mobi',full:'Fiat Mobi Like 1.0',version:'Like 1.0',urban:14.5}},dolphin:{id:'dolphin',name:'Dolphin',version:'GS',full:'BYD Dolphin GS',range:291,battery:44.9,category:'Hatches médios',gas:{name:'Onix',full:'Chevrolet Onix 1.0 MT',version:'1.0 manual',urban:13.5}}};
const state={screen:'routine',selectedScenario:null,input:{car:'mini',kmDay:40,daysMonth:30,charging:'yes',uf:'mg'},a:{rangeFactor:.8,window:.6,efficiency:.9,safety:1.3,homeTariff:1.2,publicTariff:2.5},result:null,checks:[false,false,false],fuel:{data:normalizeFuel(API_SNAPSHOT),status:'saved',loading:false,lastError:null}};
try{const cached=JSON.parse(localStorage.getItem('localiza-fuel-v2'));const data=normalizeFuel(cached);if(data.collectedAt>state.fuel.data.collectedAt)state.fuel.data=data;}catch{}
const number=(n,d=0)=>Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d});
const brl=(n,d=0)=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:d,maximumFractionDigits:d});
const collectionDate=()=>state.fuel.data.collectedAt.slice(0,10).split('-').reverse().join('/');
function gasoline(uf=state.input.uf){const value=state.fuel.data.prices[uf];if(!Number.isFinite(value)||value<=0)throw new Error('A API não tem preço para esse estado. Escolha outro.');return value;}
function compute(){return simulate(state.input,CARS[state.input.car],{...state.a,gasPrice:gasoline()});}
function radio(name,values,current){return `<div class="seg">${values.map(([v,label,glyph])=>`<input type="radio" id="${name}-${v}" name="${name}" value="${v}" ${v===current?'checked':''}><label for="${name}-${v}">${icon(glyph)}<span>${label}</span></label>`).join('')}</div>`;}
function fuelNote(uf=state.input.uf){const price=state.fuel.data.prices[uf];return `<div class="fuel-inline"><span class="fuel-glyph">${icon('gas-pump')}</span><div><strong>${Number.isFinite(price)?`Gasolina em ${uf.toUpperCase()} · ${brl(price,2)}/L`:'Estado sem preço na API'}</strong><small>${state.fuel.loading?'Consultando a API…':state.fuel.status==='live'?'Consulta API':state.fuel.status==='unavailable'?'Consulta indisponível · dado salvo':'Dado salvo'} · coleta ${collectionDate()}</small></div></div>`;}
function stateOptions(current){return Object.entries(STATES).map(([uf,name])=>`<option value="${uf}" ${uf===current?'selected':''} ${Number.isFinite(state.fuel.data.prices[uf])?'':'disabled'}>${name}${Number.isFinite(state.fuel.data.prices[uf])?'':' · sem dado'}</option>`).join('');}
function syncForm(){const form=$('routineForm');if(!form)return;const data=new FormData(form);state.input.kmDay=Number(data.get('kmDay'));state.input.charging=data.get('charging');}
function render(){
 const isRoutine=state.screen==='routine';
 document.querySelectorAll('[data-scenario]').forEach(button=>{const active=button.dataset.scenario===state.selectedScenario;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});
 $('stepRoutine').classList.toggle('active',isRoutine);$('stepResult').classList.toggle('active',!isRoutine);$('stepResult').disabled=!state.result;
 $('stepRoutine').setAttribute('aria-current',isRoutine?'step':'false');$('stepResult').setAttribute('aria-current',isRoutine?'false':'step');
 $('screen').innerHTML=isRoutine?routine():resultScreen();
 $('dock').innerHTML=isRoutine?`<button class="primary" data-action="simulate" ${Number.isFinite(state.fuel.data.prices[state.input.uf])?'':'disabled'}>Ver meu cenário ${icon('arrow-right')}</button>`:`<button class="icon-button" data-action="edit" aria-label="Editar rotina">${icon('sliders-horizontal')}</button><button class="primary" data-action="next">Antes de assinar ${icon('arrow-right')}</button>`;
}
function routine(){const i=state.input;return `<div class="intro"><div class="eyebrow">Simulador de rotina</div><h1>Um elétrico funciona<br>para você?</h1><p>Compare sua rotina e os gastos com combustível.</p></div><form id="routineForm"><section class="card vehicle-card"><div class="section-label"><span class="label-icon">${icon('car-profile')} Escolha o elétrico</span></div><div class="cars">${Object.values(CARS).map(c=>`<button type="button" class="car" data-car="${c.id}" aria-pressed="${i.car===c.id}"><span class="check">${icon('check-circle')}</span><img src="${images[c.id]}" alt="${c.full}"><strong>${c.name}</strong><small>Comparar com ${c.gas.name}</small></button>`).join('')}</div></section><section class="card routine-card"><div class="question"><div class="range-head"><label class="label-icon" for="kmDay">${icon('path')} Km por dia</label><output id="kmOutput" for="kmDay">${i.kmDay} <small>km</small></output></div><input type="range" id="kmDay" name="kmDay" min="10" max="240" step="5" value="${i.kmDay}"><div class="range-labels"><span>10 km</span><span>240 km</span></div><p class="hint" id="monthPreview">${number(i.kmDay*i.daysMonth)} km/mês · ${i.daysMonth} dias</p></div><fieldset class="question"><legend class="label-icon">${icon('lightning')} Onde você pode recarregar?</legend>${radio('charging',[['yes','Casa / trabalho','house-line'],['no','Só na rua','charging-station']],i.charging)}<p id="chargingHint" class="hint">${chargingHint()}</p></fieldset></section><div class="price-setting"><div data-fuel-note>${fuelNote()}</div><button type="button" class="icon-button" data-action="assumptions" aria-label="Mudar estado e tarifas">${icon('sliders-horizontal')}</button></div><button type="button" class="subtle-link label-icon" data-action="assumptions">${icon('sliders-horizontal')} Ajustar estado e tarifas</button><p class="note">${icon('info')}<span>Estimativa de uso. Não inclui a mensalidade da assinatura.</span></p><div id="formError" class="error" role="alert" hidden></div></form>`;}
function chargingHint(){return state.input.charging==='yes'?'Confirme se há um carregador disponível.':'Você vai depender de pontos públicos.';}
function row(label,value){return `<div class="data-row"><span>${label}</span><strong>${value}</strong></div>`;}
function group(id,title,subtitle,glyph,body){return `<details class="group" id="group-${id}"><summary><span class="group-icon">${icon(glyph)}</span><span class="summary-text"><strong>${title}</strong><small>${subtitle}</small></span>${icon('caret-down','chevron')}</summary><div class="group-body">${body}</div></details>`;}
const STATUS={fits:{badge:'Rotina compatível',title:'Seu trajeto cabe na estimativa.',detail:'Confirme a recarga em casa ou no trabalho.'},adjust:{badge:'Planeje a recarga',title:'Seu trajeto cabe. A recarga pede atenção.',detail:'Confira os pontos públicos antes de sair.'},'not-fit':{badge:'Reveja este cenário',title:'A distância pede outra configuração.',detail:'Considere outro carro ou recargas durante o dia.'}};
function resultScreen(){const r=state.result,i=state.input,c=CARS[i.car],s=STATUS[r.status];const fraction=i.kmDay*state.a.safety/r.usableRange,filled=Math.min(10,Math.ceil(fraction*10)),max=Math.max(r.fuelCost,r.electricCost);const cheaper=r.savings>=0;
 const autonomy=row('Sua rotina',`${number(i.kmDay)} km/dia`)+row('Estimativa entre recargas',`${number(r.usableRange)} km`)+row('Onde recarregar',i.charging==='yes'?'Casa / trabalho':'Pontos públicos')+`<div class="explain">${i.charging==='yes'?'Confirme o acesso ao carregador e avalie a instalação, se necessário.':'Confira o conector, a disponibilidade e uma alternativa de recarga.'}</div>`;
 const method=row('Gasolina em '+i.uf.toUpperCase(),brl(gasoline(),2)+'/L')+row('Consumo do '+c.gas.name,number(c.gas.urban,1)+' km/L na cidade')+row('Energia em '+(i.charging==='yes'?'casa/trabalho':'ponto público'),brl(r.tariff,2)+'/kWh')+row('Preço coletado',collectionDate())+`<div class="explain">Consumo a gasolina: Inmetro 2026. O elétrico usa uma estimativa conservadora, calculada a partir da bateria e da autonomia.<br><br>Consideramos 80% da autonomia nominal, bateria entre 20% e 80%, perdas de recarga de 10% e margem de 30% no trajeto diário.</div><p class="hint">Modelos da mesma categoria no PBE. Não comparamos equipamentos ou preço de compra.</p><button class="subtle-link label-icon" data-action="assumptions">${icon('sliders-horizontal')} Ajustar estado e tarifas</button>`;
 return `<div class="intro result-intro"><div class="eyebrow">${c.full}</div><h1>Seu cenário</h1><p>${number(i.kmDay)} km por dia · ${number(r.monthlyKm)} km por mês</p></div><div class="result-car-switch" role="group" aria-label="Escolha o comparativo">${Object.values(CARS).map(car=>`<button type="button" data-car="${car.id}" aria-pressed="${i.car===car.id}"><strong>${car.name}</strong><small>× ${car.gas.name}</small></button>`).join('')}</div><section class="hero ${r.status}"><div class="hero-head"><div><span class="badge">${icon(r.status==='not-fit'?'warning-circle':'check-circle')}${s.badge}</span><h2>${s.title}</h2></div>${r.status==='not-fit'?`<span class="status-warning">${icon('warning-circle')}</span>`:`<img class="art3d battery-art" src="${artwork.battery3d}" alt="" aria-hidden="true">`}</div><p>${s.detail}</p><div class="ticks" aria-hidden="true">${Array.from({length:10},(_,j)=>`<span class="${j<filled?'filled':''}"></span>`).join('')}</div><div class="meter-label"><span>Seu dia · ${number(i.kmDay)} km</span><strong>Entre recargas · ${number(r.usableRange)} km</strong></div></section><section class="card comparison-card"><div class="comparison-title"><div><span class="eyebrow">Mesmo percurso</span><h2>Gasto por mês</h2></div><img class="art3d money-art" src="${artwork.money3d}" alt="" aria-hidden="true"></div><div class="cost-comparison"><div class="cost-side"><span class="mini-icon">${icon('gas-pump')} Gasolina</span><img class="compare-car-photo" src="${gasImages[i.car]}" alt="Foto ilustrativa do ${c.gas.full}"><h3>${c.gas.name}</h3><small>${c.gas.version}</small><strong>${brl(r.fuelCost)}</strong><small>${brl(r.fuelPerKm,2)} / km</small><div class="bar"><span style="width:${r.fuelCost/max*100}%"></span></div></div><div class="cost-side electric"><span class="mini-icon">${icon('lightning')} Elétrico</span><img class="compare-car-photo" src="${images[i.car]}" alt="Foto do ${c.full}"><h3>${c.name}</h3><small>${c.version}</small><strong>${brl(r.electricCost)}</strong><small>${brl(r.electricPerKm,2)} / km</small><div class="bar"><span style="width:${r.electricCost/max*100}%"></span></div></div></div><div class="saving ${cheaper?'':'negative'}"><span class="saving-caption">${icon('wallet')}<span>${cheaper?'Economia estimada':'Custo adicional estimado'}<small>em energia e combustível</small></span></span><span><strong>${brl(Math.abs(r.savings))}</strong><small>/mês</small></span></div><div class="comparison-source" data-fuel-note>${fuelNote()}</div></section>${group('charging','Autonomia e recarga',`${number(r.usableRange)} km estimados entre recargas`,'battery-charging',autonomy)}${group('method','Como calculamos','Preços, consumo e premissas','gauge',method)}<p class="note">${icon('info')}<span>Estimativa. Não inclui assinatura, instalação ou taxas extras.</span></p>`;
}
function openModal(title,body){$('modalTitle').textContent=title;$('modalContent').innerHTML=body;$('modal').showModal();}
function assumptions(){openModal('Estado e tarifas',`<form id="assumptionForm"><div class="field full"><label class="label-icon" for="pref-state">${icon('map-pin')} Estado do preço da gasolina</label><div class="state-controls"><select id="pref-state" name="uf">${stateOptions(state.input.uf)}</select><button type="button" class="icon-button" data-action="refresh" aria-label="Atualizar preços" ${state.fuel.loading?'disabled':''}>${icon('arrows-clockwise')}</button></div></div><div class="modal-fuel-note" data-fuel-note>${fuelNote()}</div><p class="hint">Média divulgada pela API, não o preço de um posto.</p><div class="field-grid"><div class="field full"><label class="label-icon" for="a-homeTariff">${icon('house-line')} Energia em casa/trabalho (R$/kWh)</label><input type="number" id="a-homeTariff" name="homeTariff" min="0.01" max="20" step="0.01" value="${state.a.homeTariff}" required><p class="hint">Use a tarifa da sua conta de luz.</p></div><div class="field full"><label class="label-icon" for="a-publicTariff">${icon('charging-station')} Energia na rua (R$/kWh)</label><input type="number" id="a-publicTariff" name="publicTariff" min="0.01" max="20" step="0.01" value="${state.a.publicTariff}" required><p class="hint">Use a tarifa do ponto de recarga.</p></div><div class="field full"><label class="label-icon" for="a-daysMonth">${icon('calendar-dots')} Dias de uso por mês</label><input type="number" id="a-daysMonth" name="daysMonth" min="1" max="31" step="1" value="${state.input.daysMonth}" required></div></div><p class="hint">As tarifas de energia começam com valores de exemplo. A API não fornece etanol nesta consulta.</p><button type="submit" class="primary">Aplicar ajustes ${icon('check-circle')}</button></form>`);}
function updateFuelViews(){document.querySelectorAll('[data-fuel-note]').forEach(el=>{const uf=el.closest('#modalContent')&&$('pref-state')?$('pref-state').value:state.input.uf;el.innerHTML=fuelNote(uf);});const button=document.querySelector('[data-action="refresh"]');if(button)button.disabled=state.fuel.loading;const select=$('pref-state');if(select){const selected=select.value;select.innerHTML=stateOptions(selected);}}
async function refreshFuel(){if(state.fuel.loading)return;state.fuel.loading=true;state.fuel.lastError=null;updateFuelViews();const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
 try{const response=await fetch(API,{signal:controller.signal,mode:'cors',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});if(!response.ok)throw new Error('HTTP '+response.status);const payload=await response.json(),data=normalizeFuel(payload);if(data.collectedAt>=state.fuel.data.collectedAt){state.fuel.data=data;try{localStorage.setItem('localiza-fuel-v2',JSON.stringify(payload));}catch{}}state.fuel.status='live';}
 catch(error){state.fuel.status='unavailable';state.fuel.lastError=String(error.message||error);}
 finally{clearTimeout(timer);state.fuel.loading=false;if(state.result){if(Number.isFinite(state.fuel.data.prices[state.input.uf]))state.result=compute();else{state.result=null;state.screen='routine';toast('A API não trouxe preço para este estado. Escolha outro.');}const opened=[...document.querySelectorAll('details[open]')].map(el=>el.id);render();opened.forEach(id=>{if($(id))$(id).open=true;});}updateFuelViews();const primary=document.querySelector('[data-action="simulate"]');if(primary)primary.disabled=!Number.isFinite(state.fuel.data.prices[state.input.uf]);}
 return state.fuel;
}
function next(){openModal('Antes de assinar',`<div class="section-label"><span>O que confirmar</span><span id="checkCount"></span></div><div class="progress" id="checkProgress"></div><ul class="checklist">${[['Onde recarregar',state.input.charging==='yes'?'Confirme o acesso ou a instalação do carregador.':'Confira pontos públicos e uma alternativa.','charging-station'],['Condições do plano','Confira a mensalidade e a franquia de km.','car-profile'],['Primeiros usos','Peça orientação sobre recarga e suporte.','lightning']].map(([title,detail,glyph],j)=>`<li><label><input type="checkbox" data-check="${j}" ${state.checks[j]?'checked':''}><span class="list-icon">${icon(glyph)}</span><span><strong>${title}</strong><small>${detail}</small></span></label></li>`).join('')}</ul><button class="primary" data-action="summary">Ver resumo ${icon('arrow-right')}</button>`);updateChecks();}
function updateChecks(){if(!$('checkCount'))return;$('checkCount').textContent=state.checks.filter(Boolean).length+' de 3';$('checkProgress').innerHTML=state.checks.map(v=>`<span class="${v?'done':''}"></span>`).join('');}
function summary(){const r=state.result,c=CARS[state.input.car],i=state.input;const value=`SIMULAÇÃO DE ROTINA\n${c.full} × ${c.gas.full}\nRotina: ${i.kmDay} km/dia, ${i.daysMonth} dias/mês\nResultado: ${STATUS[r.status].badge}\nRecarga: ${i.charging==='yes'?'Casa / trabalho':'Pontos públicos'}\nEnergia: ${brl(r.electricCost,2)}/mês\nGasolina: ${brl(r.fuelCost,2)}/mês\n${r.savings>=0?'Economia':'Custo adicional'}: ${brl(Math.abs(r.savings),2)}/mês\nGasolina em ${i.uf.toUpperCase()}: ${brl(gasoline(),2)}/L, coleta ${collectionDate()}\nEstimativa de energia e combustível. Não inclui assinatura, instalação ou taxas extras. Autonomia não garantida.`;$('modalTitle').textContent='Seu resumo';$('modalContent').innerHTML=`<textarea id="copyText" readonly aria-label="Resumo da simulação"></textarea><button class="primary" data-action="copy">Copiar resumo ${icon('copy')}</button>`;$('copyText').value=value;}
function about(){openModal('Sobre a simulação',`<p>Compare a rotina e os gastos de uso de um elétrico e de um carro a gasolina.</p><p>A gasolina vem da Combustível API. O app mostra a data da coleta e usa o último dado salvo se a consulta falhar.</p><p>A energia é uma estimativa. Não inclui assinatura, instalação, estacionamento ou taxas extras de recarga.</p><div class="sources"><a href="https://combustivelapi.com.br/" target="_blank" rel="noopener">Combustível API</a><br><a href="https://www.gov.br/inmetro/pt-br/assuntos/avaliacao-da-conformidade/programa-brasileiro-de-etiquetagem/tabelas-de-eficiencia-energetica/veiculos-automotivos-pbe-veicular" target="_blank" rel="noopener">Inmetro · PBE Veicular 2026</a><br><a href="https://phosphoricons.com/" target="_blank" rel="noopener">Ícones: Phosphor Duotone</a> · <a href="https://old.3dicons.co/" target="_blank" rel="noopener">3dicons</a><br><small>Ilustrações BYD. Protótipo não oficial.</small></div>`);}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,2800);}
function run(){syncForm();try{state.result=compute();state.screen='result';render();document.querySelector('.app').scrollTo(0,0);}catch(error){$('formError').hidden=false;$('formError').textContent=error.message;}}
function edit(){state.screen='routine';render();document.querySelector('.app').scrollTo(0,0);}
document.addEventListener('input',event=>{if(event.target.closest('#routineForm')){syncForm();state.result=null;$('stepResult').disabled=true;$('kmOutput').innerHTML=state.input.kmDay+' <small>km</small>';$('monthPreview').textContent=number(state.input.kmDay*state.input.daysMonth)+' km/mês · '+state.input.daysMonth+' dias';$('chargingHint').textContent=chargingHint();}});
document.addEventListener('change',event=>{if(event.target.matches('[data-check]')){state.checks[Number(event.target.dataset.check)]=event.target.checked;updateChecks();}if(event.target.id==='pref-state')updateFuelViews();});
document.addEventListener('submit',event=>{if(event.target.id==='routineForm'){event.preventDefault();run();}if(event.target.id==='assumptionForm'){event.preventDefault();if(!event.target.reportValidity())return;const data=new FormData(event.target);const uf=data.get('uf');try{gasoline(uf);}catch(error){toast(error.message);return;}state.input.uf=uf;state.input.daysMonth=Number(data.get('daysMonth'));state.a.homeTariff=Number(data.get('homeTariff'));state.a.publicTariff=Number(data.get('publicTariff'));if(state.result)state.result=compute();$('modal').close();render();toast('Ajustes aplicados.');}});
document.addEventListener('click',async event=>{const car=event.target.closest('[data-car]');if(car){syncForm();state.input.car=car.dataset.car;state.result=state.screen==='result'?compute():null;render();return;}const preset=event.target.closest('[data-scenario]');if(preset){const key=preset.dataset.scenario;state.selectedScenario=key;state.input={...state.input,kmDay:key==='limit'?220:40,charging:key==='public'?'no':'yes'};try{state.result=compute();state.screen='result';render();document.querySelector('.app').scrollTo(0,0);}catch(error){toast(error.message);}return;}
 const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='simulate')run();if(action==='edit')edit();if(action==='result'&&state.result){state.screen='result';render();document.querySelector('.app').scrollTo(0,0);}if(action==='assumptions'){syncForm();assumptions();}if(action==='about')about();if(action==='close')$('modal').close();if(action==='next')next();if(action==='summary')summary();if(action==='refresh')await refreshFuel();if(action==='copy'){const text=$('copyText');try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text.value);else{text.focus();text.select();if(!document.execCommand('copy'))throw new Error('copy');}toast('Resumo copiado.');}catch{text.focus();text.select();toast('Selecione o texto e copie.');}}});
$('modal').addEventListener('click',event=>{if(event.target===$('modal')){const rect=$('modal').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)$('modal').close();}});
window.LocalizaDemo={state,CARS,compute,render,run,edit,refreshFuel,gasoline};
render();refreshFuel();
</script>
